name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run synthetic tests
        shell: pwsh
        run: ./build.ps1
      - name: Verify speed and usage statistics
        shell: pwsh
        run: dotnet run --project tests/SpeedMetrics.Tests/SpeedMetrics.Tests.csproj -c Release
      - name: Verify visible conversation routing
        shell: pwsh
        run: python tests/test_visible_routing.py dist/CodexStatusbar.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CodexTokenGlass-win-x64
          path: dist/CodexStatusbar.exe
